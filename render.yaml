# Render.com Blueprint (https://render.com/docs/blueprint-spec)
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.
services:
  - type: web
    name: recipeai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn run:app"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: recipeai-db
          property: connectionString

databases:
  - name: recipeai-db
    plan: free
